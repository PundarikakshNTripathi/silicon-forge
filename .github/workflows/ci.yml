name: CI
on:
  push: {branches: [main]}
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python ${{ matrix.python }}
      - name: Install
        run: uv pip install -e ".[api,providers,tui,mcp,otel,dev]"
      - name: Lint
        run: uv run ruff check services tests scripts
      - name: License headers and dependency licenses
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          uv run python scripts/spdx.py --check
          uv run python scripts/notices.py --check
      - name: Test
        run: uv run pytest -q

  agentbench:  # the harness against the real LangGraph and Pydantic AI, so a breaking framework release is noticed here
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python 3.12
      - name: Install (frameworks included)
        run: uv pip install -e ".[api,providers,bench,dev]"
      - name: Agent benchmark harness
        run: uv run pytest -q tests/test_agentbench.py tests/test_agentbench_proxy.py tests/test_agentbench_arms.py tests/test_agentbench_cli.py

  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure and build
        working-directory: services/telemetry_engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: ctest
        working-directory: services/telemetry_engine
        run: ctest --test-dir build -C Release --output-on-failure

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: {package_json_file: services/dashboard/package.json}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: pnpm, cache-dependency-path: services/dashboard/pnpm-lock.yaml}
      - working-directory: services/dashboard
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          pnpm run test
          pnpm run build:demo-static  # the static demo must keep building from the committed bundle

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Agent harness files point at AGENTS.md
        run: python scripts/check_harness.py

  demo-bundle:  # rebuilds the static demo's data (it needs the C++ lint engine) and compares it with the committed copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python 3.12
      - name: Install
        run: uv pip install -e ".[api,providers,dev]"
      - name: Build the lint engine
        working-directory: services/telemetry_engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Demo bundle is current and clean
        run: uv run pytest -q tests/test_demo_bundle.py -rs
