name: Docker

# Builds the orchestrator image, checks that it runs as a non-root user and answers its health check, and writes an SBOM.
# Runs when the Docker files or dependencies change, on release tags, and on demand. It does not push anything.
on:
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - "pyproject.toml"
      - "services/dashboard/package.json"
      - "services/dashboard/pnpm-lock.yaml"
      - ".github/workflows/docker.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -f docker/Dockerfile.orchestrator -t siliconforge-orchestrator:ci .

      - name: It runs unprivileged and answers its health check
        run: |
          cid=$(docker run -d -p 127.0.0.1:8000:8000 siliconforge-orchestrator:ci)
          trap 'docker logs "$cid" | tail -30; docker rm -f "$cid" > /dev/null' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          uid=$(docker exec "$cid" id -u)
          test "$uid" != "0"
          echo "running as uid $uid"
          curl -fsS http://127.0.0.1:8000/ | grep -qi "<title>SiliconForge"

      - name: Software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: siliconforge-orchestrator:ci
          format: spdx-json
          artifact-name: siliconforge-orchestrator.spdx.json

  eda-backend:
    # The Docker EDA backend, end to end: build the EDA image, then run a real project through `flow run --backend docker`
    # (lint with Verilator, synthesis with Yosys, and the RTL-to-netlist equivalence proof). Place and route is not in this image.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SiliconForge
        run: python -m pip install -e ".[api]"
      - name: Build the EDA image
        run: docker build -f docker/Dockerfile.eda -t siliconforge-eda:latest docker
      - name: Run lint, synthesis and equivalence through the Docker backend
        run: |
          mkdir -p /tmp/proj/rtl
          cp hardware/examples/up_down_counter/rtl/up_down_counter.sv /tmp/proj/rtl/
          siliconforge flow init /tmp/proj --top up_down_counter --sources "rtl/*.sv" --clock clk --period 10
          siliconforge flow check /tmp/proj
          siliconforge flow run /tmp/proj --backend docker --stages lint,synth | tee /tmp/flow.log
          grep -q "equivalence proven" /tmp/flow.log
          grep -q "lint   pass" /tmp/flow.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-flow-report
          path: /tmp/proj/.siliconforge/flow/**/report.*
          if-no-files-found: warn
