# SiliconForge in containers.
#   docker compose -f docker/docker-compose.yml up --build            # API and web UI at http://127.0.0.1:8000
#   docker compose -f docker/docker-compose.yml --profile eda build   # the EDA worker image (Yosys, SymbiYosys, Verilator)
# The port is published on the loopback interface only. To reach it from another machine, put a reverse proxy with TLS in front and set
# SILICONFORGE_API_TOKEN; the API refuses requests without the token when it is set.

services:
  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
    image: siliconforge:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SILICONFORGE_API_TOKEN: ${SILICONFORGE_API_TOKEN:-}
      SILICONFORGE_VLLM_URL: ${SILICONFORGE_VLLM_URL:-}   # an OpenAI-compatible server for the `vllm` profile
    volumes:
      - sf-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  eda-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.eda
    image: siliconforge-eda:latest
    profiles: ["eda"]
    volumes:
      - sf-data:/work
    security_opt:
      - no-new-privileges:true

volumes:
  sf-data:
