version: "3.9"

services:
  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
    ports:
      - "8000:8000"
    environment:
      - SILICONFORGE_EDA_MODE=${SILICONFORGE_EDA_MODE:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ../runs:/app/runs

  eda-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.eda
    image: siliconforge-eda:latest
    profiles: ["eda"]
    volumes:
      - ../runs:/work

  dashboard:
    image: node:20-alpine
    working_dir: /ui
    volumes:
      - ../services/dashboard:/ui
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - orchestrator
