<!doctype html>
<html><head><meta charset="utf-8"><title>terminal</title>
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
<style>
  html, body { margin: 0; background: #0b1020; height: 100%; }
  #wrap { padding: 14px 16px; display: inline-block; }
  .xterm .xterm-viewport { overflow: hidden !important; }
</style></head>
<body><div id="wrap"><div id="t"></div></div>
<script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
<script>
  const port = new URLSearchParams(location.search).get("port");
  const term = new Terminal({ cols: 104, rows: 32, fontFamily: "Cascadia Mono, Consolas, monospace", fontSize: 15, lineHeight: 1.1,
    cursorBlink: false, allowProposedApi: true, scrollback: 0,
    theme: { background: "#0b1020", foreground: "#e8ecf6", cursor: "#e8ecf6" } });
  term.open(document.getElementById("t"));
  window.term = term;
  const ws = new WebSocket(`ws://127.0.0.1:${port}`);
  ws.onmessage = (e) => term.write(e.data);
  term.onData((d) => ws.readyState === 1 && ws.send(JSON.stringify({ type: "key", data: d })));
  window.screenText = () => { const b = term.buffer.active; let s = ""; for (let i = 0; i < term.rows; i++) s += (b.getLine(i)?.translateToString(true) ?? "") + "\n"; return s; };
</script></body></html>
