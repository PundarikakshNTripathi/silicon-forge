# ASAP7 7nm Predictive PDK Grounding & Guardrail Spec
pdk_name: "asap7"
node_nm: 7
stdcell_library: "asap7sc7p5t_SIMPLE_RVT_TT"
nominal_voltage_v: 0.7
typical_corner: "TT_0p70V_25C"
signoff_corners:
  - "SS_0p63V_100C"
  - "FF_0p77V_0C"
  - "TT_0p70V_25C"
metal_layers: ["M1", "M2", "M3", "M4", "M5", "M6", "M7", "M8", "M9"]
min_clock_period_ns: 0.5
default_site: "asap7sc7p5t"

