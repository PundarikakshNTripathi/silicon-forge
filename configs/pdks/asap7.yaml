  - "BUFx"
  - "DFFHQNx"
  - "INVx"
  - "MUX2x"
  - "NAND2x"
  - "NOR2x"
  - "OR2x"
  - "TIEHIx"
  - "TIELOx"
  - "XOR2x"

allowed_flow_vars:
  - "DESIGN_NAME"
  - "VERILOG_FILES"
  - "CLOCK_PORT"
  - "CLOCK_PERIOD"
  - "FP_CORE_UTIL"
  - "PL_TARGET_DENSITY_PCT"
