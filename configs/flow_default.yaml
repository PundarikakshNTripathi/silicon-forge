# SiliconForge master configuration
project_name: "siliconforge"

# EDA execution backend:
#   simulated - deterministic surrogate models (demos/CI; results are labelled "simulated", never real)
#   native    - Yosys/SymbiYosys/Verilator/LibreLane on PATH
#   wsl       - the same tools inside a WSL2 distro (Windows)  -> see docs/eda-setup.md
#   docker    - the tools inside a container
# CLI override: --backend wsl
eda_mode: "simulated"
pdk: "sky130A"   # "sky130A" (validated), "gf180mcuD" (one design validated), "ihp-sg13g2" (allowlist only), "asap7"
workspace_root: "runs"
telemetry_binary: "services/telemetry_engine/build/sf-telemetry"

eda:
  engines:                       # SymbiYosys engine per task
    bmc: "smtbmc bitwuzla"
    prove: "abc pdr"             # IC3/PDR proves unbounded properties k-induction cannot
    cover: "smtbmc bitwuzla"
  pnr_timeout_sec: 3600
  wsl:
    distro: "Ubuntu-24.04"
    env_scripts: ["$HOME/eda/oss-cad-suite/environment"]
    # LibreLane devshell AppImage extracted with --appimage-extract (no root/Nix needed)
    librelane_cmd: ["$HOME/eda/librelane/squashfs-root/AppRun", "librelane"]
  docker:
    image: "siliconforge-eda:latest"

# Pipeline iteration & signoff limits
pipeline:
  max_rtl_repair_iters: 5
  max_formal_iters: 4
  max_pnr_rl_episodes: 6
  formal_bmc_depth: 20
  stop_after: null               # null | "formal" | "lec": verify-only runs (skip place-and-route)
  timing_corner: "worst"         # "worst" = multi-corner signoff; or "tt" / "ss" / "ff" to pick a corner
  require_lec_pass: true
  require_zero_drc: true
  require_clean_lvs: true

# PPA targets (can be overridden per design spec)
targets:
  clock_period_ns: 10.0
  max_area_um2: 25000.0
  max_power_mw: 5.0
  min_wns_ns: 0.0

# RL & evolutionary PPA optimizer settings
rl_optimizer:
  algorithm: "hybrid_ppo_ucb_pareto"
  exploration_c: 1.414
  ppo_clip_eps: 0.2
  learning_rate: 0.15
  pareto_archive_size: 8
  parallel_episodes: 1           # real P&R episodes take minutes: raise to 3-4 on a many-core box
  early_stop_on_clean: true      # stop as soon as a signoff-clean recipe is found
  allow_clock_relax: false       # let the optimizer also try relaxed clock periods (reports achievable Fmax)
  reward_weights:
    timing_wns: 4.0
    timing_tns: 1.5
    area: 1.5
    power: 1.5
    drc_penalty: 5.0
    lvs_penalty: 10.0
    runtime_penalty: 0.2

# Inference routing, caching, and cost guardrails (profiles and prices live in configs/models.yaml)
inference:
  profile: "replay"              # replay | local | hybrid | cloud | openai | gemini | subscription
  enable_semantic_cache: true    # exact-match response cache for low-temperature calls
  cache_path: "runs/_cache/llm.sqlite"   # persistent across runs; remove for an in-memory cache
  max_budget_usd: 15.0
  max_total_tokens: 500000
  stage_token_budgets:           # hard per-stage ceilings (prompt + completion tokens)
    ARCHITECT: 60000
    RTL_GEN: 80000
    RTL_REPAIR: 150000
    FORMAL_VERIFY: 100000
    PNR_RL_OPT: 40000
  cli_bridge_enabled: false      # opt-in: use your signed-in claude/codex/gemini CLI (subscription). See docs/providers.md
