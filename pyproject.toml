[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "siliconforge"
version = "0.5.0"
description = "Local-first autonomous Spec-to-RTL-to-GDSII chip design agent with formal verification guardrails"
readme = "README.md"
authors = [{name = "SiliconForge contributors"}]
keywords = ["eda", "rtl", "verilog", "formal-verification", "asic", "openroad", "yosys", "llm-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
providers = [
    "anthropic>=0.40",
    "openai>=1.50",
    "keyring>=25.0",
]
verification = [
    "cocotb>=1.9",
]
tui = [
    "textual>=0.80",
]
mcp = [
    "mcp>=2.0",
]
otel = [  # export agent traces as OpenTelemetry (GenAI conventions) to any OTLP collector
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
bench = [  # the agent frameworks `siliconforge agentbench` compares against our own loop (benchmarks only; never imported otherwise)
    "langgraph>=1.2",
    "langchain>=1.5",
    "langchain-openai>=1.8",
    "pydantic-ai-slim[openai]>=2.0",
]
plots = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/PundarikakshNTripathi/silicon-forge"
Issues = "https://github.com/PundarikakshNTripathi/silicon-forge/issues"

[project.scripts]
siliconforge = "services.orchestrator.main:cli_main"

[tool.setuptools.packages.find]
include = ["services*"]
exclude = ["services.dashboard*", "services.telemetry_engine*"]

[tool.setuptools.package-data]
"services.orchestrator" = ["skills/packs/*.md"]
"services" = ["_resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
# generated by `siliconforge isa gen`; the test suite checks they match the spec instead
extend-exclude = ["hardware/isa/*/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
