[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "siliconforge"
version = "1.0.0"
description = "Production-grade autonomous Spec-to-RTL-to-GDSII Chip Design Agent Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]
verification = [
    "cocotb>=1.9.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
siliconforge = "services.orchestrator.main:cli_main"

[tool.ruff]
line-length = 100
target-version = "py311"
