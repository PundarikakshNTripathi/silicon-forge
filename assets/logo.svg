<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SiliconForge">
  <title>SiliconForge</title>
  <style>
    .wafer { fill: #0e1520; }
    .route { stroke: #f5f6f8; }
    @media (prefers-color-scheme: dark) { .wafer { fill: #e8edf4; } .route { stroke: #0f151d; } }
  </style>
  <!-- a wafer with its flat edge -->
  <path class="wafer" d="M14.34 55A29 29 0 1 1 49.66 55Z"/>
  <!-- a Manhattan-routed S: the conductor, the initial -->
  <path class="route" d="M44 18H24V30H40V42H20" fill="none" stroke-width="5" stroke-linejoin="miter"/>
  <!-- the two via pads where the route lands -->
  <rect x="39.500" y="13.500" width="9" height="9" fill="#f2a900"/>
  <rect x="15.500" y="37.500" width="9" height="9" fill="#f2a900"/>
</svg>
