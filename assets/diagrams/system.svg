<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="t d"><title id="t">SiliconForge system</title><desc id="d">Desktop, web, terminal and MCP clients feed the workspace agent and pipeline, which call the model router and the EDA runner.</desc>
<style>
  :root { --paper:#f5f6f8; --card:#ffffff; --ink:#0e1520; --ink2:#3c4657; --ink3:#626c7b; --rule:#c9cfd8; --amber:#f2a900; --wash:#fbeec7; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0f151d; --card:#141c26; --ink:#e8edf4; --ink2:#b2bccb; --ink3:#8593a6; --rule:#33415a; --amber:#ffb81c; --wash:#2e2410; } }
  text { font-family: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, -apple-system, sans-serif; fill: var(--ink); }
  .bg { fill: var(--paper); }
  .box { fill: var(--card); stroke: var(--ink); stroke-width: 1.6; }
  .box.quiet { stroke: var(--rule); stroke-width: 1.2; }
  .box.hot { fill: var(--wash); stroke: var(--ink); stroke-width: 1.6; }
  .box.stamp { fill: var(--ink); }
  .frame { fill: none; stroke: var(--rule); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .t { font-size: 15px; font-weight: 700; } .s { font-size: 12.5px; fill: var(--ink2); } .c { font-size: 12.5px; font-weight: 700; fill: var(--ink3); }
  .tw { fill: var(--paper); }
  .ln { stroke: var(--ink); stroke-width: 1.6; fill: none; } .ln.q { stroke: var(--ink3); stroke-width: 1.2; }
  .loop { stroke: var(--amber); stroke-width: 3; fill: none; } .arrowhead { fill: var(--ink); }
  .redo { fill: var(--amber); stroke: var(--ink); stroke-width: 1.4; }
  .hatch { fill: url(#h); stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 4 3; }
</style>
<defs>
  <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--card)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--ink)" stroke-width="1.5"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--amber)"/></marker>
</defs>
<rect class="bg" width="1100" height="560"/><rect class="frame" x="20" y="40" width="1060" height="76"/><text class="c" x="30" y="32">Surfaces</text><rect class="box" x="36" y="52" width="240" height="52"/><text class="t" x="48" y="74">Desktop app</text><text class="s" x="48" y="93">Electron</text><rect class="box" x="298" y="52" width="240" height="52"/><text class="t" x="310" y="74">Web cockpit</text><text class="s" x="310" y="93">React</text><rect class="box" x="560" y="52" width="240" height="52"/><text class="t" x="572" y="74">Terminal</text><text class="s" x="572" y="93">chat, agent, TUI</text><rect class="box" x="822" y="52" width="240" height="52"/><text class="t" x="834" y="74">MCP server</text><text class="s" x="834" y="93">Claude Code, Codex, Antigravity</text><rect class="frame" x="20" y="160" width="1060" height="96"/><text class="c" x="30" y="152">Core (Python)</text><rect class="box" x="36" y="172" width="330" height="72"/><text class="t" x="48" y="194">Workspace agent</text><text class="s" x="48" y="213">sandboxed tools, permission modes, undo</text><rect class="box" x="386" y="172" width="330" height="72"/><text class="t" x="398" y="194">Deterministic pipeline</text><text class="s" x="398" y="213">contract &gt; RTL &gt; guardrails &gt; formal &gt; layout</text><rect class="box" x="736" y="172" width="328" height="72"/><text class="t" x="748" y="194">Verification and ISA toolkit</text><text class="s" x="748" y="213">lockstep, mutation, coverage, ISA generator</text><path class="ln q" d="M200 106 L200 170" marker-end="url(#a)"/><path class="ln q" d="M550 106 L550 170" marker-end="url(#a)"/><path class="ln q" d="M900 106 L900 170" marker-end="url(#a)"/><rect class="frame" x="20" y="300" width="520" height="150"/><text class="c" x="30" y="292">Model router</text><rect class="box" x="36" y="312" width="160" height="66"/><text class="t" x="48" y="334">Profiles</text><text class="s" x="48" y="353">tiers, fallbacks</text><rect class="box hot" x="210" y="312" width="150" height="66"/><text class="t" x="222" y="334">Policy</text><text class="s" x="222" y="353">enforced allow-list</text><rect class="box" x="374" y="312" width="150" height="66"/><text class="t" x="386" y="334">Cache, ledger</text><text class="s" x="386" y="353">budgets, usage log</text><rect class="box" x="36" y="388" width="150" height="52"/><text class="t" x="48" y="410">llama.cpp</text><text class="s" x="48" y="429">local, GPU guard</text><rect class="box" x="198" y="388" width="150" height="52"/><text class="t" x="210" y="410">Gemini via agy</text><text class="s" x="210" y="429">opt-in CLI</text><rect class="box" x="360" y="388" width="164" height="52"/><text class="t" x="372" y="410">Claude, OpenAI APIs</text><text class="s" x="372" y="429">keys in the keychain</text><rect class="frame" x="570" y="300" width="510" height="150"/><text class="c" x="580" y="292">EDA runner</text><rect class="box stamp" x="586" y="314" width="190" height="40"/><text class="t tw" x="598" y="339">native, WSL, Docker</text><rect class="hatch" x="790" y="314" width="130" height="40"/><text class="t" x="802" y="339" style="paint-order:stroke;stroke:var(--card);stroke-width:5px">simulated</text><rect class="box quiet" x="586" y="366" width="150" height="30"/><text class="t" x="598" y="388">Yosys</text><rect class="box quiet" x="746" y="366" width="150" height="30"/><text class="t" x="758" y="388">SymbiYosys</text><rect class="box quiet" x="906" y="366" width="150" height="30"/><text class="t" x="918" y="388">Verilator</text><rect class="box quiet" x="586" y="404" width="150" height="30"/><text class="t" x="598" y="426">Icarus, cocotb</text><rect class="box quiet" x="746" y="404" width="150" height="30"/><text class="t" x="758" y="426">OpenROAD</text><rect class="box quiet" x="906" y="404" width="150" height="30"/><text class="t" x="918" y="426">mcy</text><path class="ln q" d="M200 246 L200 298" marker-end="url(#a)"/><path class="ln q" d="M470 246 L470 298" marker-end="url(#a)"/><path class="ln q" d="M640 246 L640 298" marker-end="url(#a)"/><path class="ln q" d="M900 246 L900 298" marker-end="url(#a)"/><text class="s" x="24" y="500" text-anchor="start">Missing tools raise an error. They are never silently replaced by simulated results.</text><text class="s" x="24" y="522" text-anchor="start">Another program&#x27;s GPU job or model server is read, never stopped or evicted.</text></svg>