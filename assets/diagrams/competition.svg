<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="t d"><title id="t">Competition workflow</title><desc id="d">From a design brief through architecture and ISA, RTL and tests, verification, synthesis budget, gate-level simulation and hardening, to a write-up with an AI-usage ledger.</desc>
<style>
  :root { --paper:#f7f5f0; --card:#fffefb; --ink:#0b1b33; --ink2:#37435c; --ink3:#5b6680; --rule:#ddd8cb; --amber:#f2a900; --wash:#e3ebfb; --l-contract:#5b4bd6; --l-rtl:#d9482b; --l-guardrails:#b07d00; --l-formal:#1f6feb; --l-lec:#0f9d74; --l-pnr:#b4309a; --l-signoff:#0b1b33; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0a1424; --card:#101c30; --ink:#e6ecf7; --ink2:#b3c0d6; --ink3:#8496b3; --rule:#1f3050; --amber:#ffb81c; --wash:#13284d; --l-contract:#8d82ff; --l-rtl:#ff7a5c; --l-guardrails:#f0b429; --l-formal:#5aa2ff; --l-lec:#3ddc9b; --l-pnr:#e870cf; --l-signoff:#dbe4f3; } }
  text { font-family: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, -apple-system, sans-serif; fill: var(--ink); }
  .bg { fill: var(--paper); }
  .box { fill: var(--card); stroke: var(--ink); stroke-width: 1.6; }
  .box.quiet { stroke: var(--rule); stroke-width: 1.2; }
  .box.hot { fill: var(--wash); stroke: var(--ink); stroke-width: 1.6; }
  .box.stamp { fill: var(--ink); }
  .frame { fill: none; stroke: var(--rule); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .t { font-size: 15px; font-weight: 700; } .s { font-size: 12.5px; fill: var(--ink2); } .c { font-size: 12.5px; font-weight: 700; fill: var(--ink3); }
  .tw { fill: var(--paper); }
  .ln { stroke: var(--ink); stroke-width: 1.6; fill: none; } .ln.q { stroke: var(--ink3); stroke-width: 1.2; }
  .loop { stroke: var(--amber); stroke-width: 3; fill: none; } .arrowhead { fill: var(--ink); }
  .redo { fill: var(--amber); stroke: var(--ink); stroke-width: 1.4; }
  .hatch { fill: url(#h); stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 4 3; }
  .band { stroke: none; }
</style>
<defs>
  <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--card)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--ink)" stroke-width="1.6"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--amber)"/></marker>
</defs>
<rect class="bg" width="1100" height="300"/><rect class="box" x="24" y="70" width="118" height="96"/><text class="t" x="36" y="92">Brief</text><text class="s" x="36" y="111">rules and budget</text><rect class="box" x="156" y="70" width="118" height="96"/><text class="t" x="168" y="92">Architecture</text><text class="s" x="168" y="111">spec, ISA,</text><text class="s" x="168" y="127">area estimate</text><path class="ln " d="M143 118 L155 118" marker-end="url(#a)"/><rect class="box" x="288" y="70" width="118" height="96"/><text class="t" x="300" y="92">RTL and tests</text><text class="s" x="300" y="111">per module,</text><text class="s" x="300" y="127">lockstep</text><path class="ln " d="M275 118 L287 118" marker-end="url(#a)"/><rect class="box hot" x="420" y="70" width="118" height="96"/><text class="t" x="432" y="92">Verify</text><text class="s" x="432" y="111">mutation, formal,</text><text class="s" x="432" y="127">coverage</text><path class="ln " d="M407 118 L419 118" marker-end="url(#a)"/><rect class="box" x="552" y="70" width="118" height="96"/><text class="t" x="564" y="92">Budget</text><text class="s" x="564" y="111">real IHP cells,</text><text class="s" x="564" y="127">tile fit</text><path class="ln " d="M539 118 L551 118" marker-end="url(#a)"/><rect class="box" x="684" y="70" width="118" height="96"/><text class="t" x="696" y="92">Gate level</text><text class="s" x="696" y="111">PDK cell models</text><path class="ln " d="M671 118 L683 118" marker-end="url(#a)"/><rect class="box" x="816" y="70" width="118" height="96"/><text class="t" x="828" y="92">Harden</text><text class="s" x="828" y="111">official flow,</text><text class="s" x="828" y="127">Docker or CI</text><path class="ln " d="M803 118 L815 118" marker-end="url(#a)"/><rect class="box" x="948" y="70" width="118" height="96"/><text class="t" x="960" y="92">Write-up</text><text class="s" x="960" y="111">evidence and</text><text class="s" x="960" y="127">AI ledger</text><path class="ln " d="M935 118 L947 118" marker-end="url(#a)"/><path class="loop" d="M480 168 L480 204 L348 204 L348 168" marker-end="url(#am)"/><text class="s" x="288" y="226" text-anchor="start">a surviving mutant or failing proof sends you back to tests or RTL</text><text class="s" x="24" y="36" text-anchor="start">Every model call is recorded in .siliconforge/ai-usage.jsonl (metadata and a prompt hash, never prompt text) and the router drops any model the workspace does not allow.</text><text class="c" x="24" y="276" text-anchor="start">You submit. The tool never submits for you.</text></svg>