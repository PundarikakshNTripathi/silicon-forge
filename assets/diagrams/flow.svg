<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-labelledby="t d"><title id="t">SiliconForge flow</title><desc id="d">Spec to contract, RTL, guardrails, formal, synthesis and equivalence, layout, signoff, with repair loops back to RTL.</desc>
<style>
  :root { --paper:#f5f6f8; --card:#ffffff; --ink:#0e1520; --ink2:#3c4657; --ink3:#626c7b; --rule:#c9cfd8; --amber:#f2a900; --wash:#fbeec7; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0f151d; --card:#141c26; --ink:#e8edf4; --ink2:#b2bccb; --ink3:#8593a6; --rule:#33415a; --amber:#ffb81c; --wash:#2e2410; } }
  text { font-family: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, -apple-system, sans-serif; fill: var(--ink); }
  .bg { fill: var(--paper); }
  .box { fill: var(--card); stroke: var(--ink); stroke-width: 1.6; }
  .box.quiet { stroke: var(--rule); stroke-width: 1.2; }
  .box.hot { fill: var(--wash); stroke: var(--ink); stroke-width: 1.6; }
  .box.stamp { fill: var(--ink); }
  .frame { fill: none; stroke: var(--rule); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .t { font-size: 15px; font-weight: 700; } .s { font-size: 12.5px; fill: var(--ink2); } .c { font-size: 12.5px; font-weight: 700; fill: var(--ink3); }
  .tw { fill: var(--paper); }
  .ln { stroke: var(--ink); stroke-width: 1.6; fill: none; } .ln.q { stroke: var(--ink3); stroke-width: 1.2; }
  .loop { stroke: var(--amber); stroke-width: 3; fill: none; } .arrowhead { fill: var(--ink); }
  .redo { fill: var(--amber); stroke: var(--ink); stroke-width: 1.4; }
  .hatch { fill: url(#h); stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 4 3; }
</style>
<defs>
  <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--card)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--ink)" stroke-width="1.5"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--amber)"/></marker>
</defs>
<rect class="bg" width="1100" height="400"/><rect class="box quiet" x="24" y="28" width="1052" height="44"/><text class="t" x="36" y="50">Spec in plain language</text><text class="s" x="354" y="56" text-anchor="start">Tool verdicts decide every edge below. The model proposes; formal tools, equivalence checks and layout reports dispose.</text><rect class="box" x="24" y="120" width="128" height="112"/><text class="t" x="36" y="142">Contract</text><text class="s" x="36" y="161">ports, clocks,</text><text class="s" x="36" y="177">budgets, typed IR</text><rect class="box" x="176" y="120" width="128" height="112"/><text class="t" x="188" y="142">RTL</text><text class="s" x="188" y="161">SystemVerilog</text><text class="s" x="188" y="177">from any model</text><path class="ln " d="M154 176.0 L174 176.0" marker-end="url(#a)"/><rect class="box" x="328" y="120" width="128" height="112"/><text class="t" x="340" y="142">Guardrails</text><text class="s" x="340" y="161">6 gates: ports, lint,</text><text class="s" x="340" y="177">PDK cells, flow vars,</text><text class="s" x="340" y="193">vacuity, LEC</text><path class="ln " d="M306 176.0 L326 176.0" marker-end="url(#a)"/><rect class="box hot" x="480" y="120" width="128" height="112"/><text class="t" x="492" y="142">Formal</text><text class="s" x="492" y="161">SymbiYosys: BMC,</text><text class="s" x="492" y="177">PDR proof, cover</text><path class="ln " d="M458 176.0 L478 176.0" marker-end="url(#a)"/><rect class="box" x="632" y="120" width="128" height="112"/><text class="t" x="644" y="142">Synthesis</text><text class="s" x="644" y="161">Yosys, then prove</text><text class="s" x="644" y="177">RTL = netlist</text><path class="ln " d="M610 176.0 L630 176.0" marker-end="url(#a)"/><rect class="box" x="784" y="120" width="128" height="112"/><text class="t" x="796" y="142">Layout</text><text class="s" x="796" y="161">OpenROAD,</text><text class="s" x="796" y="177">RL knob tuning</text><path class="ln " d="M762 176.0 L782 176.0" marker-end="url(#a)"/><rect class="box" x="936" y="120" width="128" height="112"/><text class="t" x="948" y="142">Signoff</text><text class="s" x="948" y="161">worst-corner</text><text class="s" x="948" y="177">timing, DRC, LVS</text><path class="ln " d="M914 176.0 L934 176.0" marker-end="url(#a)"/><path class="ln " d="M88 72 L88 118" marker-end="url(#a)"/><path class="loop" d="M392.0 234 L392.0 266 L258.0 266 L258.0 236" marker-end="url(#am)"/><path class="loop" d="M544.0 234 L544.0 298 L222.0 298 L222.0 236" marker-end="url(#am)"/><text class="s" x="404.0" y="260" text-anchor="start">lint and contract fixes</text><text class="s" x="556.0" y="292" text-anchor="start">counterexample repair: only the failing cone of logic is sent back</text><rect class="box quiet" x="24" y="330" width="1052" height="52"/><text class="t" x="36" y="352">Provenance on every result</text><rect class="box stamp" x="260" y="344" width="132" height="24"/><text class="s tw" x="272" y="361" style="font-weight:700">real · WSL</text><text class="s" x="404" y="361" text-anchor="start">produced by Yosys, SymbiYosys, OpenROAD</text><rect class="hatch" x="692" y="344" width="132" height="24"/><text class="s" x="704" y="361" style="font-weight:700;paint-order:stroke;stroke:var(--card);stroke-width:5px">simulated</text><text class="s" x="836" y="361" text-anchor="start">surrogate models, labelled</text></svg>