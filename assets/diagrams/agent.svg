<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="t d"><title id="t">The agent loop</title><desc id="d">A request becomes a prompt, the model answers with one JSON action, permission rules and your approval gate it, the tool runs in a sandbox, its output is redacted and fenced, and every step is recorded as metadata-only spans.</desc>
<style>
  :root { --paper:#fcfbf9; --card:#ffffff; --ink:#1b2130; --ink2:#434b5d; --ink3:#656d7c; --rule:#e6e2d9; --amber:#f2a900; --wash:#eceef6; --l-contract:#5b4bd6; --l-rtl:#d9482b; --l-guardrails:#b07d00; --l-formal:#1f6feb; --l-lec:#0f9d74; --l-pnr:#b4309a; --l-signoff:#1b2130; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0c1220; --card:#111a2e; --ink:#e8ecf6; --ink2:#b6c1d6; --ink3:#8a99b5; --rule:#1e2942; --amber:#ffb81c; --wash:#18223f; --l-contract:#8d82ff; --l-rtl:#ff7a5c; --l-guardrails:#f0b429; --l-formal:#5aa2ff; --l-lec:#3ddc9b; --l-pnr:#e870cf; --l-signoff:#dbe4f3; } }
  text { font-family: "Geist Variable", "Segoe UI", system-ui, -apple-system, sans-serif; fill: var(--ink); }
  .bg { fill: var(--paper); }
  .box { fill: var(--card); stroke: var(--ink); stroke-width: 1.6; }
  .box.quiet { stroke: var(--rule); stroke-width: 1.2; }
  .box.hot { fill: var(--wash); stroke: var(--ink); stroke-width: 1.6; }
  .box.stamp { fill: var(--ink); }
  .frame { fill: none; stroke: var(--rule); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .t { font-size: 15px; font-weight: 700; } .s { font-size: 12.5px; fill: var(--ink2); } .c { font-size: 12.5px; font-weight: 700; fill: var(--ink3); }
  .tw { fill: var(--paper); }
  .ln { stroke: var(--ink); stroke-width: 1.6; fill: none; } .ln.q { stroke: var(--ink3); stroke-width: 1.2; }
  .loop { stroke: var(--amber); stroke-width: 3; fill: none; } .arrowhead { fill: var(--ink); }
  .redo { fill: var(--amber); stroke: var(--ink); stroke-width: 1.4; }
  .hatch { fill: url(#h); stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 4 3; }
  .band { stroke: none; }
</style>
<defs>
  <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--card)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--ink)" stroke-width="1.6"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--amber)"/></marker>
</defs>
<rect class="bg" width="1100" height="520"/><text class="s" x="24" y="28" text-anchor="start">One turn, repeated until the model answers without a tool call (or a budget, the loop guard or you stops it).</text><rect class="box" x="24" y="60" width="188" height="112"/><text class="t" x="36" y="82">Prompt</text><text class="s" x="36" y="101">instructions, project memory,</text><text class="s" x="36" y="117">tool list, transcript</text><text class="s" x="36" y="133">(older turns compacted)</text><rect class="box" x="240" y="60" width="188" height="112"/><text class="t" x="252" y="82">Model</text><text class="s" x="252" y="101">one JSON action:</text><text class="s" x="252" y="117">say, tool, args</text><text class="s" x="252" y="133">(constrained decoding)</text><path class="ln " d="M214 116.0 L238 116.0" marker-end="url(#a)"/><rect class="box hot" x="456" y="60" width="188" height="112"/><text class="t" x="468" y="82">Permission</text><text class="s" x="468" y="101">deny rules, then mode,</text><text class="s" x="468" y="117">then allow rules,</text><text class="s" x="468" y="133">then you approve</text><path class="ln " d="M430 116.0 L454 116.0" marker-end="url(#a)"/><rect class="box" x="672" y="60" width="188" height="112"/><text class="t" x="684" y="82">Tool</text><text class="s" x="684" y="101">path-confined sandbox,</text><text class="s" x="684" y="117">undo, pre and post</text><text class="s" x="684" y="133">hooks</text><path class="ln " d="M646 116.0 L670 116.0" marker-end="url(#a)"/><rect class="box" x="888" y="60" width="188" height="112"/><text class="t" x="900" y="82">Result</text><text class="s" x="900" y="101">keys redacted, wrapped</text><text class="s" x="900" y="117">as untrusted data,</text><text class="s" x="900" y="133">clipped</text><path class="ln " d="M862 116.0 L886 116.0" marker-end="url(#a)"/><path class="ln q" d="M982.0 174 L982.0 206 L118.0 206 L118.0 176" marker-end="url(#a)"/><text class="s" x="476" y="200" text-anchor="start">the result goes back into the transcript, and the model decides the next step</text><rect class="frame" x="24" y="238" width="1052" height="92"/><text class="c" x="34" y="230">Guards inside the loop (tested with scripted models)</text><rect class="box quiet" x="36" y="252" width="244" height="66"/><text class="t" x="48" y="274">Loop guard</text><text class="s" x="48" y="293">a note at the third identical</text><text class="s" x="48" y="309">call, a stop at the fifth</text><rect class="box quiet" x="298" y="252" width="244" height="66"/><text class="t" x="310" y="274">Step budget</text><text class="s" x="310" y="293">per turn; a cost and token</text><text class="s" x="310" y="309">budget per workspace</text><rect class="box quiet" x="560" y="252" width="244" height="66"/><text class="t" x="572" y="274">Interrupt</text><text class="s" x="572" y="293">Esc stops the turn before</text><text class="s" x="572" y="309">the next model call</text><rect class="box quiet" x="822" y="252" width="244" height="66"/><text class="t" x="834" y="274">Policy</text><text class="s" x="834" y="293">the router drops models the</text><text class="s" x="834" y="309">workspace does not allow</text><rect class="box quiet" x="24" y="366" width="330" height="62"/><text class="t" x="36" y="388">investigate</text><text class="s" x="36" y="407">a read-only helper with a fresh context;</text><text class="s" x="36" y="423">only its short answer comes back</text><rect class="box quiet" x="374" y="366" width="330" height="62"/><text class="t" x="386" y="388">Project memory</text><text class="s" x="386" y="407">notes in .siliconforge/memory.md,</text><text class="s" x="386" y="423">secret-masked, editable by you</text><text class="c" x="24" y="356" text-anchor="start">Also part of the loop</text><rect class="box quiet" x="724" y="366" width="352" height="62"/><text class="t" x="736" y="388">Spans: metadata only</text><text class="s" x="736" y="407">run &gt; step &gt; model call | tool call: time, tokens,</text><text class="s" x="736" y="423">error class. No prompts, arguments or output.</text><text class="s" x="24" y="462" text-anchor="start">Every span feeds the same four measurements: where the time goes (model, tools, overhead), how often tools work, what a solved task costs, and whether the agent recovers.</text><text class="s" x="24" y="482" text-anchor="start">They reach the Insights page, `siliconforge trace`, OTLP (Phoenix, Langfuse) and a Prometheus endpoint.</text></svg>