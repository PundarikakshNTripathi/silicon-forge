<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="t d"><title id="t">Verification stack</title><desc id="d">One isa.yaml generates the decoder, assembler, golden model, timing checker and docs; the RTL is checked against the model in lockstep, by mutation, formal proof, coverage and gate-level simulation.</desc>
<style>
  :root { --paper:#f7f5f0; --card:#fffefb; --ink:#0b1b33; --ink2:#37435c; --ink3:#5b6680; --rule:#ddd8cb; --amber:#f2a900; --wash:#e3ebfb; --l-contract:#5b4bd6; --l-rtl:#d9482b; --l-guardrails:#b07d00; --l-formal:#1f6feb; --l-lec:#0f9d74; --l-pnr:#b4309a; --l-signoff:#0b1b33; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0a1424; --card:#101c30; --ink:#e6ecf7; --ink2:#b3c0d6; --ink3:#8496b3; --rule:#1f3050; --amber:#ffb81c; --wash:#13284d; --l-contract:#8d82ff; --l-rtl:#ff7a5c; --l-guardrails:#f0b429; --l-formal:#5aa2ff; --l-lec:#3ddc9b; --l-pnr:#e870cf; --l-signoff:#dbe4f3; } }
  text { font-family: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, -apple-system, sans-serif; fill: var(--ink); }
  .bg { fill: var(--paper); }
  .box { fill: var(--card); stroke: var(--ink); stroke-width: 1.6; }
  .box.quiet { stroke: var(--rule); stroke-width: 1.2; }
  .box.hot { fill: var(--wash); stroke: var(--ink); stroke-width: 1.6; }
  .box.stamp { fill: var(--ink); }
  .frame { fill: none; stroke: var(--rule); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .t { font-size: 15px; font-weight: 700; } .s { font-size: 12.5px; fill: var(--ink2); } .c { font-size: 12.5px; font-weight: 700; fill: var(--ink3); }
  .tw { fill: var(--paper); }
  .ln { stroke: var(--ink); stroke-width: 1.6; fill: none; } .ln.q { stroke: var(--ink3); stroke-width: 1.2; }
  .loop { stroke: var(--amber); stroke-width: 3; fill: none; } .arrowhead { fill: var(--ink); }
  .redo { fill: var(--amber); stroke: var(--ink); stroke-width: 1.4; }
  .hatch { fill: url(#h); stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 4 3; }
  .band { stroke: none; }
</style>
<defs>
  <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--card)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--ink)" stroke-width="1.6"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--amber)"/></marker>
</defs>
<rect class="bg" width="1100" height="520"/><rect class="box hot" x="24" y="40" width="230" height="96"/><text class="t" x="36" y="62">isa.yaml</text><text class="s" x="36" y="81">one source of truth:</text><text class="s" x="36" y="97">encoding, timing, semantics</text><rect class="box quiet" x="320" y="20" width="220" height="50"/><text class="t" x="332" y="42">Verilog decoder</text><text class="s" x="332" y="61">one-hot, proved</text><path class="ln q" d="M254 88 L318 45" marker-end="url(#a)"/><rect class="box quiet" x="320" y="78" width="220" height="50"/><text class="t" x="332" y="100">Assembler</text><text class="s" x="332" y="119">labels, line errors</text><path class="ln q" d="M254 88 L318 103" marker-end="url(#a)"/><rect class="box quiet" x="320" y="136" width="220" height="50"/><text class="t" x="332" y="158">Golden model</text><text class="s" x="332" y="177">same decode as the tools</text><path class="ln q" d="M254 88 L318 161" marker-end="url(#a)"/><rect class="box quiet" x="320" y="194" width="220" height="50"/><text class="t" x="332" y="216">Timing checker</text><text class="s" x="332" y="235">pin-event gaps, proved</text><path class="ln q" d="M254 88 L318 219" marker-end="url(#a)"/><rect class="box quiet" x="320" y="252" width="220" height="50"/><text class="t" x="332" y="274">Docs</text><text class="s" x="332" y="293">bit-field diagrams</text><path class="ln q" d="M254 88 L318 277" marker-end="url(#a)"/><rect class="box" x="620" y="120" width="190" height="96"/><text class="t" x="632" y="142">RTL under test</text><text class="s" x="632" y="161">written by a person</text><text class="s" x="632" y="177">or a model</text><path class="ln " d="M540 45 L560 45 L560 150 L618 150" marker-end="url(#a)"/><text class="c" x="566" y="100" text-anchor="start">used by</text><rect class="box" x="870" y="20" width="206" height="64"/><text class="t" x="882" y="42">Lockstep</text><text class="s" x="882" y="61">state vs the golden model,</text><text class="s" x="882" y="77">after every instruction</text><path class="ln q" d="M810 168 L840 168 L840 52 L868 52" marker-end="url(#a)"/><rect class="box" x="870" y="94" width="206" height="64"/><text class="t" x="882" y="116">Mutation</text><text class="s" x="882" y="135">planted bugs,</text><text class="s" x="882" y="151">proved equivalents excluded</text><path class="ln q" d="M810 168 L840 168 L840 126 L868 126" marker-end="url(#a)"/><rect class="box" x="870" y="168" width="206" height="64"/><text class="t" x="882" y="190">Formal</text><text class="s" x="882" y="209">BMC, PDR proof,</text><text class="s" x="882" y="225">vacuity checked</text><path class="ln q" d="M810 168 L840 168 L840 200 L868 200" marker-end="url(#a)"/><rect class="box" x="870" y="242" width="206" height="64"/><text class="t" x="882" y="264">Coverage</text><text class="s" x="882" y="283">functional bins, toggle</text><path class="ln q" d="M810 168 L840 168 L840 274 L868 274" marker-end="url(#a)"/><rect class="box" x="870" y="316" width="206" height="64"/><text class="t" x="882" y="338">Gate level</text><text class="s" x="882" y="357">your tests on the netlist,</text><text class="s" x="882" y="373">PDK cell models</text><path class="ln q" d="M810 168 L840 168 L840 348 L868 348" marker-end="url(#a)"/><path class="ln q" d="M540 161 L590 161 L590 400 L850 400 L850 52 L868 52" marker-end="url(#a)"/><text class="c" x="596" y="394" text-anchor="start">golden model feeds lockstep</text><rect class="box quiet" x="24" y="420" width="1052" height="80"/><text class="t" x="36" y="442">Independent protocol decoders (UART, SPI, I2C, WS2812)</text><text class="s" x="36" y="468" text-anchor="start">They read only the pins, never the RTL, so a design cannot pass by sharing its author&#x27;s misunderstanding. Every result names the backend that ran it.</text></svg>