<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SiliconForge">
  <title>SiliconForge</title>
  <style>
    :root { --c1: #5b4bd6; --c2: #d9482b; --c3: #1f6feb; --c4: #0f9d74; --c5: #b4309a; }
    @media (prefers-color-scheme: dark) { :root { --c1: #8d82ff; --c2: #ff7a5c; --c3: #5aa2ff; --c4: #3ddc9b; --c5: #e870cf; } }
  </style>
  <!-- five metal layers stacked into an S: contract, RTL, formal, synthesis, place and route -->
  <rect x="7" y="5" width="50" height="9" rx="4.5" style="fill: var(--c1)"/>
  <rect x="7" y="17" width="22" height="9" rx="4.5" style="fill: var(--c2)"/>
  <rect x="7" y="29" width="50" height="9" rx="4.5" style="fill: var(--c3)"/>
  <rect x="35" y="41" width="22" height="9" rx="4.5" style="fill: var(--c4)"/>
  <rect x="7" y="53" width="50" height="9" rx="4.5" style="fill: var(--c5)"/>
</svg>
